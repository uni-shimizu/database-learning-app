    function showModal(title, message, isAlert = true) {
      const modal = document.getElementById('customModal');
      const modalBox = document.getElementById('modalBox');
      const titleEl = document.getElementById('modalTitle');
      const msgEl = document.getElementById('modalMessage');
      const iconEl = document.getElementById('modalIcon');

      titleEl.innerText = title;
      msgEl.innerText = message;

      if (isAlert) {
        iconEl.className = "w-10 h-10 rounded-full flex items-center justify-center bg-red-100 text-red-600 font-bold";
        iconEl.innerHTML = `✕`;
      } else {
        iconEl.className = "w-10 h-10 rounded-full flex items-center justify-center bg-indigo-100 text-indigo-600 font-bold";
        iconEl.innerHTML = `✓`;
      }

      modal.classList.remove('hidden');
      setTimeout(() => {
        modalBox.classList.remove('scale-95', 'opacity-0');
        modalBox.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    document.getElementById('modalConfirmBtn').addEventListener('click', () => {
      const modal = document.getElementById('customModal');
      const modalBox = document.getElementById('modalBox');
      modalBox.classList.remove('scale-100', 'opacity-100');
      modalBox.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 150);
    });

    async function initDatabase() {
      try {
        const config = {
          locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
        };
        const SQL = await initSqlJs(config);
        appState.db = new SQL.Database();
        appState.db.run(INITIAL_SQL);
        appState.sqlJsLoaded = true;
        console.log("SQLite Engine Ready");
      } catch (err) {
        console.error("SQL.js initialization failed:", err);
        showModal("システムエラー", "SQLエンジンの初期化に失敗しました。インターネット接続を確認してリロードしてください。");
      }
    }

    // 安全性バリデーション: SELECT文のみ許可
    function validateSelectOnly(sql) {
      // コメントの除去
      const cleanSql = sql.replace(/--.*$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '').trim();
      if (!cleanSql) {
        return { valid: false, message: "SQLが入力されていません。" };
      }

      // 危険な更新系キーワードの検出（単語境界マッチ）
      const forbiddenPatterns = [
        /\bINSERT\b/i,
        /\bUPDATE\b/i,
        /\bDELETE\b/i,
        /\bDROP\b/i,
        /\bALTER\b/i,
        /\bCREATE\b/i,
        /\bTRUNCATE\b/i,
        /\bREPLACE\b/i,
        /\bATTACH\b/i,
        /\bPRAGMA\b/i
      ];

      for (let pattern of forbiddenPatterns) {
        if (pattern.test(cleanSql)) {
          return {
            valid: false,
            message: "この教材ではSELECT文だけを使用します。"
          };
        }
      }
      
      // 先頭がSELECTまたはWITHで始まっているか
      if (!/^(SELECT|WITH)\b/i.test(cleanSql)) {
        return {
          valid: false,
          message: "この教材ではSELECT文だけを使用します。"
        };
      }

      return { valid: true };
    }

    function renderTablePreview(tableName, title, badgeColor = "bg-indigo-50 border-indigo-200 text-indigo-800") {
      if (!appState.db) return '';
      const res = appState.db.exec(`SELECT * FROM ${tableName}`);
      if (res.length === 0) return '<div class="text-xs text-slate-400">データがありません</div>';

      const columns = res[0].columns;
      const values = res[0].values;

      let html = `
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-xs">
          <div class="px-3 py-2 border-b border-slate-100 flex items-center justify-between ${badgeColor}">
            <span class="font-bold text-xs uppercase tracking-wide code-font">${title}</span>
            <span class="text-[10px] text-slate-500 font-medium">${values.length} 件</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-700">
              <thead class="bg-slate-50 text-[11px] text-slate-500 border-b border-slate-200">
                <tr>
      `;
      
      html += columns.map(c => {
                    let badge = '';
                    if (c.endsWith('_id') && c.startsWith(tableName.slice(0, 3))) {
                      badge = '<span class="key-badge badge-pk ml-1">PK</span>';
                    } else if (c.endsWith('_id')) {
                      badge = '<span class="key-badge badge-fk ml-1">FK</span>';
                    }
                    return `<th class="px-3 py-2 font-semibold code-font whitespace-nowrap">${c}${badge}</th>`;
                  }).join('');
                  
      html += `
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${values.map(row => `
                  <tr class="hover:bg-slate-50/80 transition-colors">
                    ${row.map(val => `<td class="px-3 py-1.5 whitespace-nowrap">${val}</td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
      return html;
    }

    function updateGuides(step) {
      const g = STEP_GUIDES[step];
      document.getElementById('guideAction').innerText = g.action;
      document.getElementById('guideHint').innerText = g.hint;
      document.getElementById('guideSuccess').innerText = g.success;
      document.getElementById('guideNext').innerText = g.next;

      document.getElementById('stepProgressIndicator').innerText = `STEP ${step} / ${appState.totalSteps}`;
      document.getElementById('progressBar').style.width = `${(step / appState.totalSteps) * 100}%`;
    }

    // ヒント開閉
    document.getElementById('btnToggleHint').addEventListener('click', () => {
      const g = STEP_GUIDES[appState.currentStep];
      showModal("ヒント", g.detailHint, false);
    });

                <div class="relative">

                </div>

                <div class="flex items-center justify-between pt-1">
                  <span class="text-[11px] text-slate-500">※SELECT文のみ実行可能</span>
                  <button id="btnRunSql4" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-6 py-2.5 rounded-xl shadow hover:shadow-md transition flex items-center gap-2">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>SQLを実行</span>
                  </button>
                </div>

                <!-- メッセージ領域 -->
                <div id="step4Message" class="hidden rounded-xl p-3.5 text-xs font-medium"></div>
              </div>

              <!-- 右側：参考テーブル -->
              <div class="lg:col-span-5 space-y-3">
                <div class="text-xs font-bold text-slate-500">参照：students 表</div>
                ${renderTablePreview('students', 'students (生徒表)')}
              </div>
            </div>

            <!-- 実行結果領域 -->
            <div class="mt-6 pt-5 border-t border-slate-200">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">実行結果</h3>
                <span id="step4ResultCount" class="text-xs text-slate-500">未実行</span>
              </div>
              <div id="step4ResultTable" class="min-h-[90px] bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center justify-center text-xs text-slate-400">
                「SQLを実行」ボタンを押すとここに結果が表示されます。
              </div>

            <!-- 次へ進むボタン -->
            <div id="step4NextArea" class="hidden flex justify-end pt-5">
              <button id="btnGotoStep5" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow hover:shadow-md transition flex items-center gap-2">
                <span>STEP 5（結合）へ進む</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
              </button>
            </div>
          </div>
        </div>
      `;

      // テンプレ戻し
      document.getElementById('btnFillStep4').addEventListener('click', () => {
        document.getElementById('sqlEditor4').value = "SELECT student_name, class\nFROM students\nWHERE class = '____';";
      });

      // 実行ロジック
      document.getElementById('btnRunSql4').addEventListener('click', () => {
        const sql = document.getElementById('sqlEditor4').value;
        const msgBox = document.getElementById('step4Message');
        const resTable = document.getElementById('step4ResultTable');
        const countSpan = document.getElementById('step4ResultCount');
        const nextArea = document.getElementById('step4NextArea');

        const validation = validateSelectOnly(sql);
        if (!validation.valid) {
          msgBox.className = "rounded-xl p-3.5 text-xs font-medium bg-red-50 text-red-700 border border-red-200 block";
          msgBox.innerText = validation.message;
          resTable.innerHTML = `<span class="text-red-500">${validation.message}</span>`;
          countSpan.innerText = "エラー";
          return;
        }

        try {
          const res = appState.db.exec(sql);
          if (res.length === 0) {
            resTable.innerHTML = `<span class="text-slate-500">0件の結果が返されました。条件を見直してください。</span>`;
            countSpan.innerText = "0件";
            msgBox.className = "rounded-xl p-3.5 text-xs font-medium bg-amber-50 text-amber-800 border border-amber-200 block";
            msgBox.innerText = "2Aの生徒が見つかりませんでした。WHERE class = '2A' と書かれているか確認してください。";
            return;
          }

          const columns = res[0].columns;
          const values = res[0].values;
          countSpan.innerText = `${values.length} 件`;

          let tableHtml = `
            <table class="w-full text-left text-xs border-collapse">
              <thead>
                <tr class="bg-indigo-50/70 border-b border-indigo-200 text-indigo-900">
                  ${columns.map(c => `<th class="p-2 font-bold code-font">${c}</th>`).join('')}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 bg-white">
                ${values.map(r => `<tr>${r.map(v => `<td class="p-2">${v}</td>`).join('')}</tr>`).join('')}
              </tbody>
            </table>
          `;
          resTable.innerHTML = `<div class="w-full overflow-x-auto rounded-lg border border-slate-200">${tableHtml}</div>`;

          // 成功判定: 佐藤と鈴木の2件
          const names = values.map(r => {
            const nameIdx = columns.findIndex(c => c.toLowerCase() === 'student_name');
            return nameIdx !== -1 ? r[nameIdx] : null;
          }).filter(Boolean);

          const isTwoRows = values.length === 2;
          const containsSatoAndSuzuki = names.includes('佐藤') && names.includes('鈴木');

          if (isTwoRows && containsSatoAndSuzuki) {
            msgBox.className = "rounded-xl p-3.5 text-xs font-medium bg-emerald-50 text-emerald-800 border border-emerald-200 block";
            msgBox.innerHTML = `<strong>成功！</strong> 条件に合う行を取り出す操作を<strong>『選択』</strong>といいます。佐藤・鈴木の2件が正しく抽出されました！`;
            appState.stepSuccess[4] = true;
            nextArea.classList.remove('hidden');
          } else {
            msgBox.className = "rounded-xl p-3.5 text-xs font-medium bg-amber-50 text-amber-800 border border-amber-200 block";
            msgBox.innerText = "ヒント：class が '2A' の生徒だけが表示されるように WHERE class = '2A' と指定しましょう。";
          }
        } catch (e) {

          countSpan.innerText = "エラー";
        }
      });

      document.getElementById('btnGotoStep5').addEventListener('click', () => changeStep(5));
    }

    function renderStep5() {
      const defaultJoinSql = `SELECT students.student_name, books.title\nFROM loans\nJOIN students\n  ON loans.student_id = students.student_id\nJOIN books\n  ON loans.book_id = books.book_id;`;

      const container = document.getElementById('stepContentArea');
      container.innerHTML = `
        <div class="space-y-5">
          <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
            <div class="flex items-center gap-2 mb-2">
              <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-1 rounded-md">操作③</span>
              <h2 class="text-base font-bold text-slate-900">複数の表をつなぐ操作：結合（けつごう）</h2>
            </div>
            <p class="text-sm text-slate-700 mb-4">
              問題：<strong class="text-slate-900 font-bold bg-amber-50 px-2 py-0.5 rounded border border-amber-200">誰がどの本を借りたか、生徒名（student_name）と書籍名（title）を表示してください。</strong>
            </p>

            <!-- 結合キーの視覚図 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-5">
              <div class="text-xs font-bold text-slate-700 mb-2 flex items-center gap-2">
                <span>🔗 結合の流れ（どのように表がつながるか）</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div class="bg-white p-3 rounded-lg border border-indigo-200 shadow-xs">
                  <div class="font-bold text-indigo-700 mb-1">① 生徒情報との結合</div>
                  <div class="code-font text-[11px] bg-indigo-50/70 p-2 rounded text-slate-700">
                    students.<span class="text-indigo-600 font-bold">student_id</span><br>
                    &nbsp;&nbsp;&nbsp;↓ (ON で一致)<br>
                    loans.<span class="text-indigo-600 font-bold">student_id</span>
                  </div>
                </div>

                <div class="bg-white p-3 rounded-lg border border-teal-200 shadow-xs">
                  <div class="font-bold text-teal-700 mb-1">② 書籍情報との結合</div>
                  <div class="code-font text-[11px] bg-teal-50/70 p-2 rounded text-slate-700">
                    loans.<span class="text-teal-600 font-bold">book_id</span><br>
                    &nbsp;&nbsp;&nbsp;↓ (ON で一致)<br>
                    books.<span class="text-teal-600 font-bold">book_id</span>
                  </div>
                </div>
              </div>
            </div>
      `;

      container.innerHTML += `
            <p class="text-sm text-slate-600 mb-4">
              下のSQLを読み、<strong>ON句でどのID同士を結んでいるか</strong>確認してから実行してください。
            </p>

            <!-- SQLエディタ -->
            <div class="space-y-2 mb-4">
              <div class="flex items-center justify-between">
                <label for="sqlEditor5" class="text-xs font-bold text-slate-700">SQLエディタ</label>
                <span class="text-[11px] text-slate-500">※SELECT文のみ実行可能</span>
              </div>
              <textarea id="sqlEditor5" rows="7" class="w-full bg-slate-900 text-emerald-400 code-font text-sm p-4 rounded-xl border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none transition leading-relaxed resize-none shadow-inner" spellcheck="false">${defaultJoinSql}</textarea>
            </div>

            <div class="flex justify-end mb-4">
              <button id="btnRunSql5" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-6 py-2.5 rounded-xl shadow hover:shadow-md transition flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>SQLを実行</span>
              </button>
            </div>

                JOIN books<br>
                &nbsp;&nbsp;ON <span class="bg-teal-900/80 text-teal-300 font-bold px-1.5 py-0.5 rounded border border-teal-500">loans.book_id = books.book_id</span>;

                  もう一度最初から復習する
                </button>
              </div>
            </div>

          </div>
        </div>
      `;

      // 実行
      document.getElementById('btnRunSql5').addEventListener('click', () => {
        const sql = document.getElementById('sqlEditor5').value;
        const msgBox = document.getElementById('step5Message');
        const resTable = document.getElementById('step5ResultTable');
        const countSpan = document.getElementById('step5ResultCount');
        const highlightBox = document.getElementById('step5KeyHighlight');
        const finishCard = document.getElementById('step5FinishedCard');

        const validation = validateSelectOnly(sql);
        if (!validation.valid) {
          msgBox.className = "rounded-xl p-4 text-xs font-medium bg-red-50 text-red-700 border border-red-200 block";
          msgBox.innerText = validation.message;
          resTable.innerHTML = `<span class="text-red-500">${validation.message}</span>`;
          countSpan.innerText = "エラー";
          return;
        }

        try {
          const res = appState.db.exec(sql);
          if (res.length === 0) {
            resTable.innerHTML = `<span class="text-slate-500">0件の結果が返されました。</span>`;
            countSpan.innerText = "0件";
            msgBox.className = "rounded-xl p-4 text-xs font-medium bg-amber-50 text-amber-800 border border-amber-200 block";
            msgBox.innerText = "データが取得できませんでした。JOINの条件を確認してください。";
            return;
          }

          const columns = res[0].columns;
          const values = res[0].values;
          countSpan.innerText = `${values.length} 件`;

          let tableHtml = `
            <table class="w-full text-left text-xs border-collapse">
              <thead>
                <tr class="bg-indigo-50/70 border-b border-indigo-200 text-indigo-900">
                  ${columns.map(c => `<th class="p-2 font-bold code-font">${c}</th>`).join('')}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 bg-white">
                ${values.map(r => `<tr>${r.map(v => `<td class="p-2">${v}</td>`).join('')}</tr>`).join('')}
              </tbody>
            </table>
          `;
          resTable.innerHTML = `<div class="w-full overflow-x-auto rounded-lg border border-slate-200">${tableHtml}</div>`;

          // 成功判定：生徒名と書籍名の列があり、行数が6件
          const hasStudentName = columns.some(c => c.toLowerCase().includes('student_name'));
          const hasTitle = columns.some(c => c.toLowerCase().includes('title'));
          const isSixRows = values.length === 6;

          if (hasStudentName && hasTitle && isSixRows) {
            msgBox.className = "rounded-xl p-4 text-xs font-medium bg-emerald-50 text-emerald-800 border border-emerald-200 block leading-relaxed";
            msgBox.innerHTML = `
              <div class="font-bold text-sm text-emerald-900 mb-1">🎉 結合成功！</div>
              <p>複数の表を共通する値（キー）を使ってつなぐ操作を<strong>『結合（JOIN）』</strong>といいます。</p>
              <p class="mt-1">これにより、別々の表に分かれていた「生徒名」と「本の名」が1つの表のようにまとまりました！</p>
            `;
            highlightBox.classList.remove('hidden');
            finishCard.classList.remove('hidden');
            appState.stepSuccess[5] = true;

            finishCard.scrollIntoView({ behavior: 'smooth' });
          } else {
            msgBox.className = "rounded-xl p-4 text-xs font-medium bg-amber-50 text-amber-800 border border-amber-200 block";
            msgBox.innerText = "ヒント：生徒名（student_name）と書籍名（title）の2列が含まれ、全6件の貸出データが表示されるSQLを実行してみましょう。完成例SQLの利用がおすすめです。";
          }
        } catch (e) {
          msgBox.className = "rounded-xl p-4 text-xs font-medium bg-red-50 text-red-700 border border-red-200 block";
          msgBox.innerText = `SQLエラー: ${e.message}`;
          resTable.innerHTML = `<span class="text-red-500">文法に誤りがあります。JOIN句やON句のスペルを確認してください。</span>`;
          countSpan.innerText = "エラー";
        }
      });

      const btnRestart = document.getElementById('btnRestartFromEnd');
      if (btnRestart) {
        btnRestart.addEventListener('click', resetAll);
      }
    }

    function changeStep(stepNumber) {
      if (stepNumber < 1 || stepNumber > appState.totalSteps) return;
      appState.currentStep = stepNumber;
      updateGuides(stepNumber);

      switch (stepNumber) {
        case 1:
          renderStep1();
          break;
        case 2:
          renderStep2();
          break;
        case 3:
          renderStep3();
          break;
        case 4:
          renderStep4();
          break;
        case 5:
          renderStep5();
          break;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetAll() {
      if (appState.db) {
        try {
          appState.db.close();
        } catch(e) {}
      }
      // 再初期化
      initDatabase().then(() => {
        appState.currentStep = 1;
        appState.stepSuccess = [false, false, false, false, false, false];
        changeStep(1);
        showModal("初期化完了", "データベースと学習の進行状況を最初に戻しました。", false);
      });
    }

    document.getElementById('btnResetAll').addEventListener('click', resetAll);

    // アプリ初期ロード
    window.addEventListener('DOMContentLoaded', async () => {
      await initDatabase();
      changeStep(1);
    });
  </script>
